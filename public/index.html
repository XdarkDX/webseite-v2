<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Link Portal</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <main class="container fade-slide-in">
      <section class="profile-card" id="profileCard">
        <img id="logo" class="logo hidden" alt="Logo" />
        <img id="avatar" class="avatar" alt="Avatar" />
        <h1 id="name">Lädt...</h1>
        <p id="bio" class="bio"></p>
      </section>

      <section id="links" class="links-grid" aria-label="Links"></section>

      <footer class="footer">
        <p id="footerText"></p>
        <a href="/admin/login" class="admin-link">Admin</a>
      </footer>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
