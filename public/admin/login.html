<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login</title>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <main class="auth-wrap fade-slide-in">
      <div class="panel">
        <h1>Admin Login</h1>
        <p class="muted">Sicherer Zugriff auf dein Dashboard.</p>

        <form id="loginForm" autocomplete="off">
          <label>Username<input type="text" name="username" required maxlength="40" /></label>
          <label>Passwort<input type="password" name="password" required minlength="8" maxlength="128" /></label>
          <button type="submit" class="btn-primary">Einloggen</button>
        </form>

        <p id="error" class="error"></p>
        <a href="/" class="small-link">Zur öffentlichen Seite</a>
      </div>
    </main>

    <script>
      const form = document.getElementById('loginForm');
      const errorEl = document.getElementById('error');

      form.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        errorEl.textContent = '';

        const formData = new FormData(form);
        const payload = {
          username: formData.get('username'),
          password: formData.get('password')
        };

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.ok) {
            errorEl.textContent = 'Login fehlgeschlagen.';
            return;
          }

          window.location.href = '/admin';
        } catch {
          errorEl.textContent = 'Login fehlgeschlagen.';
        }
      });
    </script>
  </body>
</html>
